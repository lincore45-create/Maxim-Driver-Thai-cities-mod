<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Maxim Driver Cities</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800;900&family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@800&text=金行茶面饭药酒福記餐堂点心烤鸭庄中糖水合艾唐人街鸡&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Srisakdi:wght@700&family=Chonburi&family=Pattaya&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#FFC800; --black:#141414; --ink:#141414; --white:#ffffff;
  --panel:#ffffff; --panel-ink:#141414; --muted:#5f5f5f; --red:#E5484D; --bg:#FFC800;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --panel:#1f1f21; --panel-ink:#f5f5f7; --muted:#b3b3b3; }
}
:root[data-theme="dark"]{ --panel:#1f1f21; --panel-ink:#f5f5f7; --muted:#b3b3b3; }
*,*::before,*::after{box-sizing:border-box;}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px); background:var(--bg);}
body{
  height:100%; margin:0; background:var(--bg); overflow:hidden;
  font-family:'Rubik','Noto Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--ink); -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent; touch-action:none;
}
#app{position:relative; width:100%; height:100%; max-width:520px; margin:0 auto; overflow:hidden; background:#86cdf2;}
#cv,#fx{position:absolute; inset:0; width:100%; height:100%; display:block;}
#cv{image-rendering:pixelated; image-rendering:crisp-edges;}
#fx{pointer-events:none;}
button{font-family:inherit; cursor:pointer;}
button:focus-visible{outline:3px solid var(--black); outline-offset:3px;}

/* HUD */
#hud{position:absolute; left:0; right:0; top:0; padding:10px 64px 0 12px; display:none; pointer-events:none;}
.hud-row{display:flex; gap:8px; align-items:stretch;}
.chip{background:rgba(20,20,20,.74); color:#fff; border-radius:14px; padding:6px 11px 7px; line-height:1.05;}
.chip small{display:block; font-size:11px; opacity:.75; margin-bottom:2px;}
.chip b{font-size:22px; font-weight:800; color:var(--yellow); font-variant-numeric:tabular-nums;}
.chip span.unit{font-size:12px; margin-left:2px; opacity:.85;}
#lives{display:flex; align-items:center; gap:4px; font-size:22px;}
#lives i{font-style:normal; color:var(--red); transition:color .2s, transform .2s;}
#lives i.lost{color:rgba(255,255,255,.25); transform:scale(.8);}
.progress{margin-top:10px; height:8px; background:rgba(20,20,20,.5); border-radius:6px; position:relative; margin-right:4px;}
.progress .fill{height:100%; width:100%; background:var(--yellow); border-radius:6px; transform:scaleX(0); transform-origin:0 50%; will-change:transform;}
.progress .mark{position:absolute; top:-3px; width:3px; height:14px; background:#fff; border-radius:2px; transform:translateX(-50%);}
.progress .mark em{position:absolute; top:16px; left:50%; transform:translateX(-50%); font-style:normal; font-size:11px; font-weight:800; color:var(--black); background:#fff; padding:1px 5px; border-radius:6px; white-space:nowrap;}
.progress .mark.got em{background:var(--yellow);}
.progress .mark:last-child em{transform:translateX(-85%);}

#muteBtn{position:absolute; top:10px; right:12px; width:44px; height:44px; border-radius:50%; border:none; background:rgba(20,20,20,.74); color:#fff; font-size:20px; z-index:20; display:flex; align-items:center; justify-content:center;}

/* Controls */
#controls{position:absolute; left:0; right:0; bottom:0; padding:12px 14px calc(46px + env(safe-area-inset-bottom,0px)); display:none; justify-content:space-between; align-items:flex-end; gap:10px;}
.pad{display:flex; gap:10px;}
.btn{width:min(78px,21vw); height:min(78px,21vw); border-radius:22px; border:none; background:rgba(20,20,20,.66); color:#fff; font-size:30px; font-weight:800; touch-action:none; display:flex; align-items:center; justify-content:center; box-shadow:0 5px 0 rgba(0,0,0,.35);}
.btn{transition:none; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; pointer-events:none;}
.pad{touch-action:none; pointer-events:auto;}
.btn.on{transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,.35);}
.btn.gas{background:var(--yellow); color:var(--black); font-size:15px; height:min(96px,26vw);}
.btn.brake{background:#fff; color:var(--black); font-size:13px;}
#controls.tilt .steer{visibility:hidden;}

/* Screens */
.screen{position:absolute; inset:0; display:none; flex-direction:column; align-items:center; z-index:10;}
.screen.show{display:flex;}

#menu{background:var(--yellow); color:var(--black); justify-content:space-between; padding:72px 22px 26px; overflow:hidden;}
#menu::before{content:""; position:absolute; inset:0; background:repeating-linear-gradient(-18deg, transparent 0 34px, rgba(20,20,20,.06) 34px 40px); pointer-events:none;}
.menu-top{position:relative; text-align:left; width:100%;}
.brand{font-weight:900; font-size:clamp(46px,15vw,72px); line-height:.86; letter-spacing:-.02em; margin:0;}
.brand span{display:block; -webkit-text-stroke:2px var(--black); color:transparent;}
.slogan{font-weight:800; font-size:clamp(20px,5.6vw,26px); line-height:1.15; margin:18px 0 8px; max-width:20ch;}
.sub{font-size:15px; line-height:1.4; margin:0; max-width:32ch; color:#3a3200;}
.hero-car{position:relative; width:min(270px,70vw); aspect-ratio:1.45; margin:4px auto 0; display:block; image-rendering:pixelated; image-rendering:crisp-edges;}
.menu-bottom{position:relative; width:100%; display:flex; flex-direction:column; gap:14px;}
.opt-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.opt-row > span{font-size:14px; font-weight:600;}
.seg{display:flex; background:rgba(20,20,20,.1); border-radius:14px; padding:3px;}
.seg button{border:none; background:transparent; padding:8px 12px; border-radius:11px; font-size:14px; font-weight:600; color:var(--black); min-width:44px;}
.seg button.on{background:var(--black); color:var(--yellow);}
.start{border:none; background:var(--black); color:var(--yellow); font-weight:800; font-size:22px; padding:19px 20px; border-radius:20px; box-shadow:0 6px 0 rgba(0,0,0,.28); width:100%;}
.start:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.28);}
.proto{font-size:12px; text-align:center; color:#5c4d00; margin:0;}

#result{background:rgba(20,20,20,.55); justify-content:center; padding:24px;}
.card{background:var(--panel); color:var(--panel-ink); border-radius:26px; padding:24px 20px 20px; width:100%; max-width:380px; text-align:center; box-shadow:0 14px 40px rgba(0,0,0,.3);}
.card h2{margin:0 0 14px; font-size:30px; font-weight:900;}
.stats{display:flex; gap:10px; margin-bottom:16px;}
.stat{flex:1; background:rgba(127,127,127,.12); border-radius:16px; padding:10px 6px;}
.stat small{display:block; font-size:12px; color:var(--muted);}
.stat b{font-size:26px; font-weight:800; font-variant-numeric:tabular-nums;}
.reward{background:var(--yellow); color:var(--black); border-radius:20px; padding:16px 12px; margin-bottom:12px;}
.reward small{display:block; font-size:14px; font-weight:600;}
.reward .val{font-size:56px; font-weight:900; line-height:1; margin:6px 0 2px; letter-spacing:-.02em;}
.reward.none{background:rgba(127,127,127,.14); color:var(--panel-ink);}
.reward.none .val{display:none;}
.hint{font-size:14px; line-height:1.35; margin:0 0 6px;}
.stamp{font-size:12px; color:var(--muted); margin:0 0 16px; font-variant-numeric:tabular-nums;}
.card .start{font-size:19px; padding:16px;}
.link{border:none; background:none; color:var(--muted); font-size:14px; margin-top:10px; padding:8px;}


/* ===== city editions: Chiang Mai · Hat Yai · Khon Kaen ===== */
#app[data-mode="cm"]{ --menubg:linear-gradient(180deg,#1b1846 0%,#33215f 34%,#6a3570 62%,#c8645e 86%,#f0a05c 100%);
  --pattern:radial-gradient(circle, rgba(255,214,130,.85) 0 1.8px, rgba(255,170,70,.16) 2.8px 7px, transparent 8px) 0 0/120px 135px, radial-gradient(circle, rgba(255,196,96,.7) 0 1.3px, rgba(255,160,60,.14) 2.2px 5px, transparent 6px) 60px 70px/90px 108px;
  --mtext:#FFF1DC; --subc:#efd2cf; --brand:#FFC24A; --acc:#FFC24A; --accink:#2a1a4a; --accsh:#9a5b12; --chip:rgba(255,255,255,.13);
  --ed:#FFD98A; --edsh:#2a1846; --rw:#2a1f55; --rwink:#FFC24A; }
#app[data-mode="hy"]{ --menubg:radial-gradient(circle at 86% 9%, rgba(255,246,200,.55) 0 30px, rgba(255,246,200,.12) 31px 70px, transparent 71px), linear-gradient(180deg,#1bb8c8 0%,#0f9cb6 55%,#0a7d97 100%);
  --pattern:repeating-conic-gradient(from 0deg at 86% 9%, rgba(255,255,255,.07) 0 5deg, transparent 5deg 16deg);
  --mtext:#ffffff; --subc:#dcf6f8; --brand:#FFE14D; --acc:#E8343C; --accink:#ffffff; --accsh:#8e1218; --chip:rgba(255,255,255,.17);
  --ed:#ffffff; --edsh:#b0242b; --rw:#E8343C; --rwink:#ffffff; }
#app[data-mode="kk"]{ --menubg:linear-gradient(180deg,#24124d 0%,#3a1c6a 55%,#52237c 100%);
  --pattern:repeating-linear-gradient(45deg, transparent 0 17px, rgba(242,193,78,.13) 17px 19px), repeating-linear-gradient(-45deg, transparent 0 17px, rgba(242,193,78,.13) 17px 19px), radial-gradient(circle, rgba(242,193,78,.22) 0 2px, transparent 2.6px) 0 0/25.5px 25.5px;
  --mtext:#f6eaff; --subc:#d9c8f0; --brand:#F2C14E; --acc:#F2C14E; --accink:#2a1450; --accsh:#8f6a12; --chip:rgba(255,255,255,.12);
  --ed:#F2C14E; --edsh:#12062b; --rw:#52237c; --rwink:#F2C14E; }

#menu{background:var(--menubg); color:var(--mtext); transition:background-color .3s;}
#menu::before{background:var(--pattern);}
#app[data-mode="cm"] #menu::before{animation:rise 18s linear infinite;}
@keyframes rise{to{background-position:0 -1080px, 60px -1010px;}}
.brand{font-size:clamp(38px,11vw,56px); color:var(--brand);}
.brand span{-webkit-text-stroke-color:var(--brand);}
.edition{display:block; margin:8px 0 0; font-size:clamp(34px,10.5vw,48px); line-height:1; color:var(--ed); text-shadow:0 3px 0 var(--edsh);}
.edition small{display:block; font-family:'Noto Sans Thai',Rubik,sans-serif; font-size:.36em; font-weight:800; letter-spacing:.02em; margin-top:6px; opacity:.9; text-shadow:none;}
#app[data-mode="cm"] .edition{font-family:'Srisakdi','Noto Sans Thai',cursive; font-weight:700;}
#app[data-mode="hy"] .edition{font-family:'Chonburi','Noto Sans Thai',serif;}
#app[data-mode="kk"] .edition{font-family:'Pattaya','Noto Sans Thai',sans-serif;}
.slogan{margin:12px 0 6px;}
.sub{color:var(--subc);}
.route{display:flex; flex-wrap:wrap; align-items:center; gap:6px 4px; margin:10px 0 0; padding:0; list-style:none; font-size:12.5px; font-weight:700;}
.route li{background:var(--chip); padding:4px 10px; border-radius:999px; white-space:nowrap;}
.route li.arr{background:none; padding:0 1px; opacity:.6;}
.mode-dots{position:absolute; top:12px; left:50%; transform:translateX(-50%); display:flex; z-index:3;}
.mode-dots button{width:30px; height:32px; padding:0; border:none; background:none; display:flex; align-items:center; justify-content:center;}
.mode-dots button::before{content:""; width:9px; height:9px; border-radius:5px; background:rgba(255,255,255,.32); transition:width .2s, background .2s;}
.mode-dots button.on::before{width:24px; background:var(--acc);}
.hero-wrap{position:relative; width:100%; display:flex; align-items:center; justify-content:center;}
.hero-wrap::before{content:""; position:absolute; left:-22px; right:-22px; bottom:-14px; height:150%; background:var(--landmark) center bottom/100% auto no-repeat; pointer-events:none; -webkit-mask-image:linear-gradient(180deg,#000 72%,transparent 100%); mask-image:linear-gradient(180deg,#000 72%,transparent 100%);}
.hero-car{width:min(250px,64vw);}
.mode-arrow{position:absolute; top:50%; transform:translateY(-50%); width:44px; height:44px; border:none; border-radius:50%; background:var(--chip); color:inherit; font-size:28px; font-weight:800; line-height:1; display:flex; align-items:center; justify-content:center; z-index:2;}
.mode-arrow.prev{left:-6px;} .mode-arrow.next{right:-6px;}
.seg{background:var(--chip);}
.seg button{color:inherit;}
.seg button.on{background:var(--acc); color:var(--accink);}
.start{background:var(--acc); color:var(--accink); box-shadow:0 6px 0 var(--accsh);}
.start:active{box-shadow:0 2px 0 var(--accsh);}
.proto{color:var(--subc); opacity:.8;}
.reward{background:var(--rw); color:var(--rwink);}
#app button:focus-visible{outline-color:var(--acc);}

@media (max-height: 800px){ .route{display:none;} .sub{font-size:13.5px;} }
@media (max-height: 760px){
  #menu{padding-top:58px; padding-bottom:18px;}
  .slogan{margin-top:10px;} .menu-bottom{gap:10px;}
  .hero-car{width:min(200px,52vw);}
  .seg button{padding:7px 11px;}
  .start{padding:16px 20px;}
}
@media (max-height: 700px){ .edition{font-size:30px; margin-top:2px;} .sub{display:none;} }
@media (max-height: 640px){ .brand{font-size:38px;} .hero-car{width:min(160px,42vw);} }
@media (prefers-reduced-motion: reduce){ .btn,.start{transition:none;} #app #menu::before{animation:none;} }
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <canvas id="fx"></canvas>

  <div id="hud">
    <div class="hud-row">
      <div class="chip"><small data-i="score"></small><b id="hScore">0</b></div>
      <div class="chip"><small data-i="dist"></small><b id="hKm">0.0</b><span class="unit" data-i="km"></span></div>
      <div class="chip" id="lives"><i>♥</i><i>♥</i><i>♥</i></div>
    </div>
    <div class="progress"><div class="fill" id="hFill"></div><div id="hMarks"></div></div>
  </div>

  <div id="controls">
    <div class="pad steer">
      <button class="btn" data-k="left" aria-label="left">◀</button>
      <button class="btn" data-k="right" aria-label="right">▶</button>
    </div>
    <div class="pad">
      <button class="btn brake" data-k="brake" data-i="brake"></button>
      <button class="btn gas" data-k="gas" data-i="gas"></button>
    </div>
  </div>

  <section class="screen show" id="menu">
    <div class="mode-dots" id="modeDots" role="tablist">
      <button data-m="cm" role="tab" aria-label="Chiang Mai"></button><button data-m="hy" role="tab" aria-label="Hat Yai"></button><button data-m="kk" role="tab" aria-label="Khon Kaen"></button>
    </div>
    <div class="menu-top">
      <h1 class="brand">MAXIM<span>DRIVER</span></h1>
      <div class="edition" id="edition"></div>
      <p class="slogan" id="slogan"></p>
      <p class="sub" id="sub"></p>
      <ul class="route" id="route"></ul>
    </div>
    <div class="hero-wrap" id="heroWrap">
      <button class="mode-arrow prev" id="modePrev" aria-label="previous city">‹</button>
      <canvas class="hero-car" id="heroCv" aria-hidden="true"></canvas>
      <button class="mode-arrow next" id="modeNext" aria-label="next city">›</button>
    </div>
    <div class="menu-bottom">
      <div class="opt-row"><span data-i="lang"></span>
        <div class="seg" id="langSeg">
          <button data-lang="th">ไทย</button><button data-lang="en">EN</button><button data-lang="ru">RU</button>
        </div>
      </div>
      <div class="opt-row" id="vehRow"><span data-i="vehicle"></span>
        <div class="seg" id="vehSeg">
          <button data-veh="car" data-i="vCar"></button><button data-veh="bike" data-i="vBike"></button>
        </div>
      </div>
      <div class="opt-row"><span data-i="controls"></span>
        <div class="seg" id="ctlSeg">
          <button data-ctl="buttons" data-i="ctlButtons"></button><button data-ctl="tilt" data-i="ctlTilt"></button>
        </div>
      </div>
      <button class="start" id="startBtn" data-i="start"></button>
      <p class="proto" data-i="proto"></p>
    </div>
  </section>

  <section class="screen" id="result">
    <div class="card">
      <h2 id="rTitle"></h2>
      <div class="stats">
        <div class="stat"><small data-i="dist"></small><b id="rKm">0</b> <span data-i="km"></span></div>
        <div class="stat"><small data-i="score"></small><b id="rScore">0</b></div>
      </div>
      <div class="reward" id="rReward">
        <small id="rRewardLabel"></small>
        <div class="val" id="rValue"></div>
      </div>
      <p class="hint" id="rHint"></p>
      <p class="stamp" id="rStamp"></p>
      <button class="start" id="againBtn" data-i="again"></button>
      <button class="link" id="menuBtn" data-i="menu"></button>
    </div>
  </section>

  <button id="muteBtn" aria-label="sound">🔊</button>
</div>

<script>
/* =========================================================
   TUNING — everything about balance lives here
   ========================================================= */
const CONFIG = {
  raceKm: 10,              // finish distance (display km)
  distanceScale: 1.6,      // display km per simulated km; raise to make the race shorter in real time
  pointsPerKm: 100,
  nearMissPoints: 10,
  nearMissTTC: 0.45,       // seconds-to-impact window that counts as a "last moment" dodge
  lives: 3,
  invulnSec: 2,
  speedStart: 20,          // m/s (×3.6 = km/h)
  speedMin: 12,            // brake never goes below this
  speedMax: 58,
  autoAccel: 0.45,         // how fast cruising speed rises by itself (m/s every second)
  gasAccel: 7,
  brakeDecel: 14,
  recoverAccel: 4,
  hitSpeedFactor: 0.45,
  puddleSpeedFactor: 0.55,
  steerSpeed: 7.5,         // lateral m/s
  gapStart: 70, gapEnd: 26,// metres between spawned obstacles at start / near finish
  tiers: [ {km:1, thb:50}, {km:5, thb:200}, {km:10, thb:500} ],
  sidewalkDrag: 3,         // speed lost per second while driving on the sidewalk
  retroWidth: 390,         // internal render width in px: lower = chunkier PS1-style pixels
  vertexSnap: true,        // snap vertices to the low-res grid (classic PS1 wobble)
};

/* ========================= i18n ========================= */

    slogan_cm:'От стен Старого города — до Дой Сутхеп!', sub_cm:'Северная столица в огнях фонариков Йи Пенг. Доедь до финиша и получи промокод до 500 ฿ на поездки.',
    d_cm0:'Старый город', d_cm1:'Нимман', d_cm2:'Дой Сутхеп',
    slogan_hy:'Рынки, поезда и знаменитая курочка!', sub_hy:'Столица юга: от Чайна-тауна до парка с Гуаньинь. Доедь до финиша и получи промокод до 500 ฿ на поездки.',
    d_hy0:'Чайна-таун', d_hy1:'Рынок Ким Йонг', d_hy2:'Городской парк',
    slogan_kk:'Кхонкэн — сердце Исана!', sub_kk:'Мимо озера и 9-ярусной ступы — к динозаврам Пху Вианга. Доедь до финиша и получи промокод до 500 ฿.',
    d_kk0:'Центр города', d_kk1:'Бынг Кэн Након', d_kk2:'Поля Исана' },
  en:{ sub:'', lang:'Language', controls:'Controls', ctlButtons:'Buttons', ctlTilt:'Tilt', start:'Start game', proto:'Prototype · Thai cities', score:'Score', dist:'Distance', km:'km', gas:'GAS', brake:'BRAKE', go:'Go!', near:'Wow! Close call!', crash:'Bang!', splash:'Splash!', mud:'Splat! Mud', kmUp:'+100 · {k} km', tierUp:'{v} promo code unlocked!', win:'Finish!', lose:'Game over', reward:'Your reward — promo code', showPromoter:'Show this screen to the promoter to get your promo code', noReward:'Drive at least 1 km to earn a promo code', again:'Play again', menu:'Menu', tiltOff:'Tilt unavailable — buttons enabled', stamp:'Result from', vehicle:'Vehicle', vCar:'Car', vBike:'Bike',
    slogan_cm:'From the Old City walls up to Doi Suthep!', sub_cm:'The Rose of the North under Yi Peng lanterns. Reach the finish and win a ride promo code worth up to 500 ฿.',

/* ========================= Game state ========================= */
let state = 'menu', ctlMode = 'buttons', G = null, paused = false;
const input = { left:false, right:false, gas:false, brake:false };
let tilt = { seen:false, base:null, steer:0 };

function newGame(){
  G = { z:0, x:-1.4, vx:0, speed:CONFIG.speedStart, cruise:CONFIG.speedStart, lives:CONFIG.lives, invuln:0,
        score:0, near:0, kmPassed:0, objs:[], nextSpawn:120, popups:[], time:0, lean:0, shake:0, flash:0,
        over:false, win:false, endTimer:0, tierShown:0, props:[], nextBlock:-1, di:0, onWalk:false };
}
const displayKm = () => Math.min(CONFIG.raceKm, G.z * CONFIG.distanceScale / 1000);
function popup(text, color = '#fff', size = 30, life = 1.1){ G.popups.push({ text, color, size, life, t:0 }); }

function spawnAt(z){
  const p = Math.min(1, G.z / FINISH_Z), dz = districtIdx(z);
  const weights = [['car', 30], ['oncoming', 16 + 14 * p], ['tuktuk', 18], ['puddle', 14], ['stop', MODE === 'kk' && dz === 2 ? 11 : 7]];
  let sum = weights.reduce((a, w) => a + w[1], 0), r = Math.random() * sum, type = 'car';
  for (const [k, w] of weights){ if ((r -= w) < 0){ type = k; break; } }
  let lane;
  if (type === 'oncoming') lane = Math.random() < .5 ? 2 : 3;
  else if (type === 'tuktuk') lane = Math.random() < .7 ? 0 : 1;
  else if (type === 'car') lane = Math.random() < .5 ? 0 : 1;
  else lane = Math.random() < .8 ? (Math.random() < .5 ? 0 : 1) : (Math.random() < .5 ? 2 : 3);
  // never fully block both of our lanes at the same spot
  if (lane <= 1){
    const other = lane === 0 ? 1 : 0;
    const blocked = G.objs.some(o => o.lane === other && o.dmg && Math.abs(o.z - z) < 30);
    const sameLane = G.objs.some(o => o.lane === lane && Math.abs(o.z - z) < 22);
    if (sameLane) return;
    if (blocked){ if (type === 'car' || type === 'tuktuk') return; lane = Math.random() < .5 ? 2 : 3; }
  }
  let v = 0;
  if (type === 'car') v = 9 + Math.random() * 8;
  if (type === 'tuktuk') v = 5 + Math.random() * 3;
  if (type === 'oncoming') v = -(10 + Math.random() * 7);
  const base = type;
  // city flavour: what the generic traffic turns into in each district
  if (base === 'tuktuk') type = MODE === 'hy' ? 'minitruck' : MODE === 'cm' && Math.random() < .3 ? 'tuktuk' : 'songthaew';
  if (base === 'stop') type = MODE === 'cm' ? (dz === 2 ? 'boulder' : 'walkbar') : MODE === 'hy' ? (dz === 1 ? 'crossing' : 'stop') : (dz === 2 ? 'buffalo' : 'stop');
  if (base === 'puddle' && MODE === 'kk' && dz === 2) type = 'mud';
  const T = TYPES[type];
  const pal = type === 'songthaew' || type === 'minitruck' ? SONGTHAEW[MODE] : CITY_CARS[MODE];
  const o = { type, base, lane, x: LANES[lane] + (Math.random() - .5) * .5, z, v, ...T,
    color: pal[Math.floor(Math.random() * pal.length)], seed: Math.random() * 100, hit:false, threat:false, nm:false, route: 1 + Math.floor(Math.random() * 23) };
  if (type === 'buffalo') o.wx = (Math.random() < .5 ? -1 : 1) * (.6 + Math.random() * .6);
  if (type === 'crossing') o.x = LANES[lane];
  G.objs.push(o);
}

function crash(o){
  // knock the obstacle aside so we never drive through it
  if (o && o.type !== 'pothole'){
    const dir = Math.sign(o.x - G.x) || (Math.random() < .5 ? -1 : 1);
    o.kvx = dir * (o.base === 'stop' ? 11 : 9);
    o.v = o.base === 'oncoming' || o.base === 'stop' ? 0 : Math.max(o.v, G.speed * .9);
    o.lane = -1;
    G.vx = -dir * 4;
  }
  G.lives--; G.invuln = CONFIG.invulnSec; G.speed *= CONFIG.hitSpeedFactor;
  G.cruise = Math.max(CONFIG.speedStart, G.cruise * 0.6); G.shake = .45; G.flash = .35;
  SND.sfx.thud(); if (navigator.vibrate) navigator.vibrate(120);
  popup(t('crash'), '#E5484D', 40, .9);
  if (G.lives <= 0) endGame(false);
}
function endGame(win){
  if (G.over) return;
  G.over = true; G.win = win; G.endTimer = win ? 1.4 : 1.0;
  SND.engineStop(); SND.musicStop();
  if (win){ SND.sfx.win(); popup(t('win'), '#FFC800', 46, 1.6); } else SND.sfx.lose();
}

function update(dt){
  G.time += dt;
  if (G.over){ G.endTimer -= dt; G.speed = Math.max(0, G.speed - 25 * dt); G.z += G.speed * dt; tickFx(dt); if (G.endTimer <= 0) showResult(); return; }

  // speed: cruise rises on its own, gas pushes above it, brake slows (never to zero)
  G.cruise = Math.min(CONFIG.speedMax, G.cruise + CONFIG.autoAccel * dt);
  if (input.brake) G.speed = Math.max(CONFIG.speedMin, G.speed - CONFIG.brakeDecel * dt);
  else if (input.gas) G.speed = Math.min(CONFIG.speedMax, G.speed + CONFIG.gasAccel * dt);
  else if (G.speed < G.cruise) G.speed = Math.min(G.cruise, G.speed + CONFIG.recoverAccel * dt);
  else G.speed = Math.max(G.cruise, G.speed - 0.8 * dt);

  // steering
  const btn = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  let target = btn * CONFIG.steerSpeed;
  if (!btn && ctlMode === 'tilt') target = tilt.steer * CONFIG.steerSpeed * 1.1;
  G.vx += (target - G.vx) * Math.min(1, dt * 18);
  G.x += G.vx * dt;
  const lim = ROAD_HALF + 2.4 - PLAYER.hw;
  if (G.x < -lim){ G.x = -lim; G.vx = 0; } if (G.x > lim){ G.x = lim; G.vx = 0; }
  G.lean += (G.vx / CONFIG.steerSpeed - G.lean) * Math.min(1, dt * 8);

  const onWalk = Math.abs(G.x) > ROAD_HALF + .15;
  if (onWalk !== G.onWalk){ G.onWalk = onWalk; G.shake = Math.max(G.shake, .12); SND.sfx.tick(); }
  if (onWalk) G.speed = Math.max(CONFIG.speedMin, G.speed - CONFIG.sidewalkDrag * dt);
  G.z += G.speed * dt;
  if (G.invuln > 0) G.invuln -= dt;
  const di = districtIdx(G.z);
  G.di = di;

  // km checkpoints
  const km = Math.floor(displayKm() + 1e-6);
  while (G.kmPassed < km && G.kmPassed < CONFIG.raceKm){
    G.kmPassed++; G.score += CONFIG.pointsPerKm; SND.sfx.coin();
    const tier = CONFIG.tiers.filter(tr => tr.km === G.kmPassed && tr.km < CONFIG.raceKm)[0];
    if (tier) popup(t('tierUp', { v: fmtTHB(tier.thb) }), '#FFC800', 28, 1.6);
    else popup(t('kmUp', { k: G.kmPassed }), '#fff', 30, 1.0);
  }
  if (G.z >= FINISH_Z){ endGame(true); return; }

  // spawn
  while (G.nextSpawn < G.z + 280 && G.nextSpawn < FINISH_Z - 30){
    spawnAt(G.nextSpawn);
    const p = Math.min(1, G.z / FINISH_Z);
    G.nextSpawn += (CONFIG.gapStart + (CONFIG.gapEnd - CONFIG.gapStart) * p) * (0.7 + Math.random() * 0.6);
  }

  // traffic: don't let cars drive through each other
  for (const o of G.objs){
    if (o.v > 0){
      for (const q of G.objs){
        if (q !== o && q.lane === o.lane && q.z > o.z && q.z - o.z < 9 && (q.v < o.v)) o.v = Math.max(q.v, 0);
      }
    }
    o.z += o.v * dt;
    if (o.kvx){
      o.x += o.kvx * dt; o.kvx *= Math.pow(.03, dt);
      const lim = ROAD_HALF + 2;
      if (Math.abs(o.x) > lim){ o.x = Math.sign(o.x) * lim; o.kvx = 0; }
      if (Math.abs(o.kvx) < .2) o.kvx = 0;
    }
  }

  // collisions & near misses
  for (const o of G.objs){
    const hwSum = o.hw + PLAYER.hw, hlSum = o.hl + PLAYER.hl, rel = o.z - G.z;
    const lat = Math.abs(o.x - G.x) < hwSum;
    if (lat && Math.abs(rel) < hlSum && !o.hit){
      o.hit = true;
      if (!o.dmg){
        G.speed *= CONFIG.puddleSpeedFactor;
        if (o.type === 'mud') SND.sfx.goo(); else SND.sfx.splash();
        popup(t(o.type === 'mud' ? 'mud' : 'splash'), o.type === 'mud' ? '#E0A86A' : '#8EC5F0', 26, .8);
      }
      else if (G.invuln <= 0) crash(o);
    }
    if (o.dmg && !o.hit && !o.nm){
      const closing = G.speed - o.v, gap = rel - hlSum;
      if (lat && gap > 0 && closing > 0 && gap / closing < CONFIG.nearMissTTC) o.threat = true;
      if (rel < -hlSum){
        o.nm = true;
        if (o.threat && G.invuln <= 0){ G.score += CONFIG.nearMissPoints; G.near++; SND.sfx.chime(); popup(t('near') + ' +' + CONFIG.nearMissPoints, '#FFC800', 30, 1.0); }
      }
    }
  }
  G.objs = G.objs.filter(o => o.z - G.z > -24 && o.z - G.z < 600);
  // buffaloes amble across the road
  for (const o of G.objs) if (o.type === 'buffalo' && !o.hit && o.wx){
    o.x += o.wx * dt;
    if (Math.abs(o.x) > ROAD_HALF - .9){ o.x = Math.sign(o.x) * (ROAD_HALF - .9); o.wx = -o.wx; }
  }
  // announce each district as we drive into it
  if (G.di !== G.lastDi){ G.lastDi = G.di; popup('◆ ' + t('d_' + MODE + G.di), '#fff', 22, 2.0); }
  if (!G.over) updateProps(dt);

  SND.engineSet((G.speed - CONFIG.speedMin) / (CONFIG.speedMax - CONFIG.speedMin), input.gas);
  tickFx(dt);
  if (ctlMode === 'tilt' && !tilt.seen && G.time > 1.5){ setCtl('buttons'); showControls(); popup(t('tiltOff'), '#fff', 18, 2.2); }
}
function tickFx(dt){
  G.shake = Math.max(0, G.shake - dt); G.flash = Math.max(0, G.flash - dt); G.wet = Math.max(0, (G.wet || 0) - dt * .55);
  for (const p of G.popups) p.t += dt; G.popups = G.popups.filter(p => p.t < p.life);
}

/* ========================= Render ========================= */
const CLOUD = [[-.5, 0], [-.42, -.16], [-.22, -.3], [0, -.36], [.2, -.28], [.36, -.18], [.5, 0]];
const CROSS_EVERY = 420;

const SKY_SCALE = { cm:[1, 1.1, 0], hy:[1.8, 1.2, .55], kk:[1.3, .7, 0] };
const TREE_LINE = { cm:[0, .25, 1], hy:[0, .3, .8], kk:[.2, .6, 1] };
function drawSky(tn){
  const T = THEME, S = T.sky;
  for (let i = 0; i < S.length; i++){
    const y0 = HOR * i / S.length, y1 = HOR * (i + 1) / S.length;
    ctx.fillStyle = rgb(S[i]); ctx.fillRect(-10, y0 - 1, W + 20, y1 - y0 + 2);
  }
  // 0 → 1 while driving toward the next district
  const fD = k => Math.max(0, Math.min(1, (G.z - GATE_Z[k] + 300) / 300)), f1 = fD(0), f2 = fD(1);
  const sr = Math.min(W, H) * .055;
  if (MODE === 'cm'){ const sx = W * .3, sy = HOR * .8; octa(sx, sy, sr * 3, 'rgba(255,170,90,.16)'); octa(sx, sy, sr * 2, 'rgba(255,190,110,.3)'); octa(sx, sy, sr * 1.3, '#ffc27a'); }
  else if (MODE === 'hy'){ const sx = W * .8, sy = HOR * .26; octa(sx, sy, sr * 1.7, 'rgba(255,246,200,.4)'); octa(sx, sy, sr, '#fff6c8'); }
  else { const sx = W * .76, sy = HOR * .52; octa(sx, sy, sr * 3, 'rgba(255,214,140,.18)'); octa(sx, sy, sr * 2, 'rgba(255,220,150,.32)'); octa(sx, sy, sr * 1.25, '#ffe2a6'); }
  for (const c of clouds){
    const x = ((c.x + tn * 5 - camX * 1.5) % (W + 160) + (W + 160)) % (W + 160) - 80, y = HOR * c.y;
    poly(CLOUD.map(p => [x + p[0] * c.w, y + p[1] * c.w]), T.cloud[0]);
    poly([[x - c.w * .5, y], [x + c.w * .5, y], [x + c.w * .36, y + c.w * .05], [x - c.w * .4, y + c.w * .05]], T.cloud[1]);
  }
  // far landmarks
  if (MODE === 'cm') drawDoiSuthep(f2);
  if (MODE === 'hy') drawGuanYinHill(tn, f2);
  // treeline where the city thins out
  const tl = TREE_LINE[MODE], tf = tl[0] + (tl[1] - tl[0]) * f1 + (tl[2] - tl[1]) * f2;
  if (tf > .02){
    const pts = [[-20, HOR]];
    for (let i = 0; i <= 48; i++) pts.push([-20 + i * (W + 40) / 48, HOR - (3 + rnd(i * 1.7 + 3) * 8 + (i % 3 === 0 ? 4 : 0)) * tf]);
    pts.push([W + 20, HOR]); poly(pts, T.treeline);
  }
  // city skyline, shrinking toward the countryside
  const sk = SKY_SCALE[MODE], skyF = sk[0] + (sk[1] - sk[0]) * f1 + (sk[2] - sk[1]) * f2;
  if (skyF > .02) for (const b of skyline){
    const x = b.x - camX * (b.far ? .8 : 1.4), h = b.h * (b.far ? .75 : 1) * skyF, y = HOR;
    const pts = b.step
      ? [[x, y], [x, y - h * .7], [x + b.w * .3, y - h * .7], [x + b.w * .3, y - h], [x + b.w, y - h], [x + b.w, y]]
      : [[x, y], [x, y - h], [x + b.w, y - h], [x + b.w, y]];
    poly(pts, b.far ? T.skyline[0] : T.skyline[1]);
    if (b.ant && skyF > .6){ ctx.fillStyle = T.skyline[1]; ctx.fillRect(x + b.w * .6, y - h - 9, 1.5, 9); }
    if (THEME.night){ ctx.fillStyle = '#ffb347'; for (let j = 0; j < 3; j++) if (rnd(b.x + j * 7.3) > .45) ctx.fillRect(x + b.w * (.15 + rnd(b.x + j) * .65), y - h * (.2 + rnd(b.x + j * 3.1) * .65), 2, 2.5); }
  }
  if (MODE === 'kk' && f1 < 1) drawFarPagoda(1 - f1 * .6);
  if (MODE === 'cm') drawSkyLanterns(tn);
  ctx.fillStyle = T.ground; ctx.fillRect(-20, HOR, W + 40, H - HOR + 20);
}
// Doi Suthep–Pui ridge with the golden chedi of Wat Phra That near the summit
function drawDoiSuthep(f2){
  const M = HOR * (.34 + .24 * f2), ox = -camX * .5, X = u => -40 + u * (W + 80) + ox;
  const back = [[0,.3],[.1,.42],[.22,.5],[.34,.62],[.46,.66],[.6,.7],[.74,.62],[.88,.5],[1,.46]];
  poly([[X(0), HOR], ...back.map(([u, h]) => [X(u), HOR - h * M * 1.05]), [X(1), HOR]], '#5a3a7a');

function drawBike(x, z){
  const K = 1.35, hl = 1.0, zN = z - hl, zF = z + hl;   // drawn ~35% oversized so it reads at low resolution

  if (Zs(zF) - camZ < NEAR) return null;
  const jacket = COL.yellow, pants = [42,46,62], body = [34,36,42], metal = [92,98,110];

  if (cowl) fq(cowl, .2, .3, .8, .7, COL.head);
  // handlebar and mirrors
  Bx(x, .4, zF - .62, zF - .52, 1.24, 1.32, COL.black);
  for (const sx of [-1, 1]){ Bx(x + sx * .3, .02, zF - .6, zF - .56, 1.32, 1.56, COL.black); Bx(x + sx * .32, .07, zF - .61, zF - .55, 1.56, 1.66, COL.black); }
  // rear body, seat, tail light and plate

  Bx(x, .2, zN + .25, zN + 1.08, .84, .94, COL.black);

  for (const sx of [-1, 1]){

    Bx(x + sx * .21, .07, zN + .98, zN + 1.14, .46, .9, pants);
    Bx(x + sx * .21, .08, zN + 1.0, zN + 1.22, .44, .52, COL.black);
  }
  const back = Hx(x, zN + .55, zN + .95, .94, 1.64, .28, .23, 0, .05, jacket, shade(jacket, -.08), shade(jacket, .2));
  if (back){ fq(back, 0, .5, 1, .7, COL.black); ftext(back, 'MAXIM', .5, .6, .17, jacket); fq(back, .3, .93, .7, 1, shade(jacket, -.25)); }
  for (const sx of [-1, 1]) Bx(x + sx * .29, .065, zN + .72, zF - .58, 1.24, 1.42, jacket);

  if (helm){ fq(helm, .42, 0, .58, 1, COL.black); fq(helm, 0, 0, 1, .12, COL.black); }
  return { back };
}

    s += `<path d='M0 194 Q100 184 200 190 T400 186 V220 H0Z' fill='#1a0c3a'/>`;
    const cx = 330; let y = 182, w = 44;
    s += `<rect x='${cx - 58}' y='182' width='116' height='8' fill='#e9dcc0'/>`;
    for (let i = 0; i < 9; i++){
      const th = i ? 8.4 - i * .35 : 12;
      s += `<rect x='${cx - w}' y='${y - th}' width='${w * 2}' height='${th}' fill='#f3e8cf'/><path d='M${cx - w - 5} ${y - th} L${cx + w + 5} ${y - th} L${cx + w * .8} ${y - th - 4} L${cx - w * .8} ${y - th - 4}Z' fill='#b9553a'/><rect x='${cx - w * .8}' y='${y - th - 5.4}' width='${w * 1.6}' height='1.5' fill='#F2C14E'/>`;
      y -= th + 5.4; w *= .8;
    }
    s += `<path d='M${cx - w} ${y} Q${cx} ${y - 20} ${cx + w} ${y}Z' fill='#F2C14E'/><rect x='${cx - 1}' y='${y - 32}' width='2' height='20' fill='#F2C14E'/>`;
    const sp = (x, h) => `<path d='M${x} 200 V${200 - h}' stroke='#140830' stroke-width='3.5'/><circle cx='${x}' cy='${200 - h}' r='9' fill='#140830'/>` +
      [0, 1, 2, 3, 4, 5, 6, 7].map(i => { const a = i / 8 * Math.PI * 2; return `<path d='M${x} ${200 - h} L${(x + Math.cos(a) * 17).toFixed(1)} ${(200 - h + Math.sin(a) * 15).toFixed(1)}' stroke='#140830' stroke-width='3' stroke-linecap='round'/>`; }).join('');
    s += sp(26, 96) + sp(62, 66) + sp(390, 74);
    return svgWrap(s);
  },
};
function setMode(m, dir){
  if (!THEMES[m]) m = 'cm';
  MODE = m; THEME = THEMES[m]; TINT = THEME.tint; HAZE = THEME.haze; DISTRICTS = CITY_D[m];
  $('app').dataset.mode = m;
  document.documentElement.style.setProperty('--bg', MODE_BG[m]);
  document.querySelectorAll('#modeDots button').forEach(b => { const on = b.dataset.m === m; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
  $('edition').innerHTML = `${MODE_NAMES[m][0]}<small>${MODE_NAMES[m][1]}</small>`;
  $('heroWrap').style.setProperty('--landmark', `url("data:image/svg+xml,${encodeURIComponent(LANDMARK[m]())}")`);
  applyPlayer(); applyLang(); renderHero();
  try { localStorage.setItem('mdc_city', m); } catch(e){}
  let still = false; try { still = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){}
  if (dir && !still) for (const el of document.querySelectorAll('#menu .menu-top, #menu .hero-wrap'))
    el.animate && el.animate([{ transform:`translateX(${dir * 56}px)`, opacity:0 }, { transform:'none', opacity:1 }], { duration:300, easing:'cubic-bezier(.2,.8,.2,1)' });
}
function shiftMode(dir){ setMode(MODES[(MODES.indexOf(MODE) + dir + MODES.length) % MODES.length], dir); }
function initialMode(){
  let q = '';
  try { const u = new URLSearchParams(location.search); q = (u.get('city') || u.get('mode') || '').toLowerCase().replace(/[\s_-]/g, ''); } catch(e){}
  const map = { cm:'cm', chiangmai:'cm', cnx:'cm', hy:'hy', hatyai:'hy', hdy:'hy', kk:'kk', khonkaen:'kk', kkc:'kk' };
  if (map[q]) return map[q];
  try { const s = localStorage.getItem('mdc_city'); if (THEMES[s]) return s; } catch(e){}
  return 'cm';
}
(() => {
  const menu = $('menu'); let sw = null;
  menu.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; sw = { x: e.clientX, y: e.clientY }; });
  menu.addEventListener('pointerup', e => {
    if (!sw) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.2) shiftMode(dx < 0 ? 1 : -1);
  });
  menu.addEventListener('pointercancel', () => { sw = null; });
  $('modePrev').addEventListener('click', () => shiftMode(-1));
  $('modeNext').addEventListener('click', () => shiftMode(1));
  document.querySelectorAll('#modeDots button').forEach(b => b.addEventListener('click', () => {
    const d = MODES.indexOf(b.dataset.m) - MODES.indexOf(MODE); if (d) setMode(b.dataset.m, Math.sign(d));
  }));
  window.addEventListener('keydown', e => { if (state === 'menu' && (e.code === 'ArrowLeft' || e.code === 'ArrowRight')) shiftMode(e.code === 'ArrowRight' ? 1 : -1); });
})();



async function startGame(){
  SND.init();
  if (ctlMode === 'tilt'){
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
        const res = await DeviceOrientationEvent.requestPermission(); if (res !== 'granted') setCtl('buttons');
      }
    } catch(e){ setCtl('buttons'); }
    tilt = { seen:false, base:null, steer:0 };
  }
  newGame(); lastHud = ''; G.wet = 0; G.fwK = -1;
  for (const k in input) input[k] = false;
  padPtr.clear(); document.querySelectorAll('.btn').forEach(b => b.classList.remove('on'));
  showScreen(null); hud.style.display = 'block'; showControls(); updateHud();
  state = 'play';
  SND.engineStart(); SND.musicStart();
  popup(t('go'), '#FFC800', 44, 1.0);
}
function showResult(){
  state = 'over'; hud.style.display = 'none'; controls.style.display = 'none';
  const km = G.win ? CONFIG.raceKm : displayKm();
  let tier = null; for (const tr of CONFIG.tiers) if (km >= tr.km - 1e-6) tier = tr;
  $('rTitle').textContent = G.win ? t('win') : t('lose');
  $('rKm').textContent = G.win ? CONFIG.raceKm : km.toFixed(1);
  $('rScore').textContent = G.score;
  const rw = $('rReward'); rw.classList.toggle('none', !tier);
  $('rRewardLabel').textContent = tier ? t('reward') : t('noReward');
  $('rValue').textContent = tier ? fmtTHB(tier.thb) : '';
  $('rHint').textContent = tier ? t('showPromoter') : '';
  $('rStamp').textContent = MODE_NAMES[MODE][0] + ' · ' + t('stamp') + ' ' + new Date().toLocaleString(LOCALE[lang], { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
  showScreen('result');
}

/* ========================= Input ========================= */
// each pad tracks its own pointers: the key under the thumb is pressed, and sliding across switches keys at once
const PADS = [...document.querySelectorAll('#controls .pad')];
const padPtr = new Map();   // pointerId -> { pad, key }
function padKeyAt(pad, x){
  const bs = [...pad.querySelectorAll('.btn')].filter(b => b.offsetParent !== null);
  let best = null, bd = 1e9;
  for (const b of bs){ const r = b.getBoundingClientRect(), c = (r.left + r.right) / 2, d = Math.abs(x - c); if (d < bd){ bd = d; best = b; } }
  return best && best.dataset.k;
}
function syncKeys(){
  const down = new Set([...padPtr.values()].map(v => v.key));
  for (const b of document.querySelectorAll('#controls .btn')){ const on = down.has(b.dataset.k); input[b.dataset.k] = on; b.classList.toggle('on', on); }
}
PADS.forEach(pad => {
  pad.addEventListener('pointerdown', e => { e.preventDefault(); try{ pad.setPointerCapture(e.pointerId); }catch(_){} padPtr.set(e.pointerId, { pad, key: padKeyAt(pad, e.clientX) }); syncKeys(); });
  pad.addEventListener('pointermove', e => { const s = padPtr.get(e.pointerId); if (!s) return; const k = padKeyAt(pad, e.clientX); if (k !== s.key){ s.key = k; syncKeys(); } });
  const up = e => { if (padPtr.delete(e.pointerId)) syncKeys(); };
  pad.addEventListener('pointerup', up); pad.addEventListener('pointercancel', up); pad.addEventListener('lostpointercapture', up);
  pad.addEventListener('contextmenu', e => e.preventDefault());
});
const KEYS = { ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right', ArrowUp:'gas', KeyW:'gas', ArrowDown:'brake', KeyS:'brake', Space:'brake' };
window.addEventListener('keydown', e => { const k = KEYS[e.code]; if (k && state === 'play'){ input[k] = true; e.preventDefault(); } });
window.addEventListener('keyup', e => { const k = KEYS[e.code]; if (k) input[k] = false; });
window.addEventListener('deviceorientation', e => {
  if (e.gamma == null) return;
  if (tilt.base === null) tilt.base = e.gamma;
  tilt.seen = true;
  const g = e.gamma - tilt.base * 0.5;
  tilt.steer = Math.max(-1, Math.min(1, Math.abs(g) < 3 ? 0 : g / 22));
});

document.querySelectorAll('#langSeg button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang; try{ localStorage.setItem('md_lang', lang); }catch(e){} applyLang();
}));
document.querySelectorAll('#ctlSeg button').forEach(b => b.addEventListener('click', () => setCtl(b.dataset.ctl)));
document.querySelectorAll('#vehSeg button').forEach(b => b.addEventListener('click', () => setVehicle(b.dataset.veh)));
$('startBtn').addEventListener('click', startGame);
$('againBtn').addEventListener('click', startGame);
$('menuBtn').addEventListener('click', () => { state = 'menu'; showScreen('menu'); fctx.clearRect(0, 0, W, H); renderHero(); });
$('muteBtn').addEventListener('click', () => { SND.init(); SND.setMuted(!SND.muted); $('muteBtn').textContent = SND.muted ? '🔇' : '🔊'; });
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ paused = true; SND.suspend(); } else { paused = false; SND.resume(); last = performance.now(); }
});

/* ========================= Loop ========================= */
let last = performance.now();
// adaptive resolution: drop the internal render width when frames run long, bring it back when there is headroom
const RES = { max: CONFIG.retroWidth, min: 300, ema: 16, t: 0 };
function adaptRes(ms){
  if (state !== 'play' || ms > 200) return;
  RES.ema += (ms - RES.ema) * .05; RES.t += ms;
  if (RES.t < 1500) return;
  if (RES.ema > 21 && CONFIG.retroWidth > RES.min){ CONFIG.retroWidth = Math.max(RES.min, CONFIG.retroWidth - 30); RES.t = 0; resize(); }
  else if (RES.ema < 13 && CONFIG.retroWidth < RES.max && RES.t > 5000){ CONFIG.retroWidth = Math.min(RES.max, CONFIG.retroWidth + 30); RES.t = 0; resize(); }
}
function frame(now){
  const ms = now - last;
  const dt = Math.min(0.05, ms / 1000); last = now;
  adaptRes(ms);
  if (!paused && G && (state === 'play')){ update(dt); if (state === 'play') updateHud(); }
  if (G && state !== 'menu') render();
  requestAnimationFrame(frame);
}
resize(); setCtl('buttons'); applyLang(); setVehicle(vehicle); setMode(initialMode());
if (document.fonts && document.fonts.ready) document.fonts.ready.then(renderHero);
requestAnimationFrame(frame);
</script>
